name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Everything but PyTorch, which only training needs.
      - run: pip install gymnasium numpy pygame-ce opencv-python-headless
      - name: Unit tests
        env:
          SDL_VIDEODRIVER: dummy
        run: python -m unittest discover -s tests -t . -v
